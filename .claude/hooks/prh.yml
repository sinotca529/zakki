# AGENTS.md の「言い回し」のうち、語として判定できるものを並べます。
# textlint-rule-prh が読みます。expected は置き換え先の目安で、
# --fix はかけません。文脈によっては別の書き方が適切です。
version: 1
rules:
  # 実体のないものを主語にした比喩
  - expected: 効果がある
    patterns:
      - /効(く|いて|いた|きます|かない|かず|け(ば|る))/
    specs:
      - from: 指示が効く
        to: 指示が効果がある

  - expected: まだ直っていない
    patterns:
      - /(バグ|不具合|問題)が生きて(いる|います)/

  - expected: エラーが出ないまま読み込まれない
    patterns:
      - /静かに(壊れる|壊れます|失敗)/

  - expected: 何が防げるのかを書く
    patterns:
      - /穴を(塞ぐ|塞ぎ|埋める)/
      - 唯一の穴

  # 英語表現の直訳
  - expected: 区別がつかない
    patterns:
      - /情報にならな(い|くなる)/

  # 強め方
  - expected: (削除する)
    patterns:
      - 唯一の
      - まさに
      - /そのもの(です|でした)/

  # 自分がした行為の書き方
  - expected: 〜しました
    patterns:
      - /((し|置い|書い|入れ|足し|直し)て)あります/
    specs:
      - from: 対応してあります
        to: 対応〜しました

  # 英語の技術用語を直訳した語
  - expected: パーセントエンコーディング
    patterns:
      - 百分率符号化
      - パーセント符号化

  # 量を添えた控えめさ
  - expected: (量を添えずに書く)
    patterns:
      - /(わずか|たった)[0-9０-９]/
      - /[0-9０-９]+(文|行|字|件)だけ/
