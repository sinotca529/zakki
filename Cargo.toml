[package]
name = "zakki"
version = "0.19.0"
edition = "2024"
description = "A static site generator with per-page encryption and serverless full-text search"
license = "MIT"
repository = "https://github.com/sinotca529/zakki"
readme = "README.md"
keywords = ["static-site", "ssg", "markdown", "blog", "generator"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/.github"]

[profile.release]
strip = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.95"
base64 = "0.22.1"
clap = { version = "4.5.23", features = ["derive"] }
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html", "simd"] }
hmac = "0.13.0"
itertools = "0.14.0"
paste = "1.0.15"
pbkdf2 = "0.13.0"
rand = "0.9.0"
rayon = "1.10.0"
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
toml = "0.9.8"
katex-rs = "0.3.0"
